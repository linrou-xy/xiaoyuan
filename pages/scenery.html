<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="欣赏天津城建大学的四季校园风光。">
    <title>校园风光｜城迹</title>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="scenery">
    <header class="site-header inner-header">
        <a class="brand" href="../index.html" aria-label="返回首页">
            <span class="brand-mark">城</span>
            <span class="brand-text">城迹<small>TCU FIELD NOTES</small></span>
        </a>
        <button class="menu-button" type="button" aria-expanded="false" aria-controls="site-nav">菜单</button>
        <nav class="site-nav" id="site-nav" aria-label="主导航">
            <a href="../index.html" data-nav="home">首页</a>
            <a href="scenery.html" data-nav="scenery">校园风光</a>
            <a href="culture.html" data-nav="culture">校园文化</a>
            <a href="life.html" data-nav="life">校园生活</a>
            <a href="memory.html" data-nav="memory">城大印象</a>
        </nav>
    </header>

    <main>
        <section class="page-hero scenery-hero">
            <div class="page-hero-copy">
                <p class="eyebrow">CHAPTER 01 / SEE</p>
                <h1>校园风光</h1>
                <p>同一条路，会被四季写成四种不同的句子。</p>
            </div>
            <div class="vertical-label">Tianjin Chengjian University</div>
        </section>

        <section class="section-wrap page-intro reveal">
            <span class="drop-cap">四</span>
            <p>天城大的美并不只在某个“打卡点”。它藏在图书馆玻璃上的春光里，藏在中心湖边被风吹皱的倒影里，也藏在秋天放慢脚步的一条小路上。</p>
        </section>

        <section class="gallery-section section-wrap">
            <div class="filter-bar" role="group" aria-label="按季节筛选图片">
                <button class="filter-button active" type="button" data-filter="all">全部</button>
                <button class="filter-button" type="button" data-filter="spring">春日</button>
                <button class="filter-button" type="button" data-filter="summer">晴夏</button>
                <button class="filter-button" type="button" data-filter="autumn">金秋</button>
                <button class="filter-button" type="button" data-filter="night">夜色</button>
            </div>

            <div class="photo-grid" id="photo-grid">
                <figure class="photo-item tall reveal" data-season="spring">
                    <img src="../images/spring-library.png" alt="春花掩映下的图书馆" loading="lazy">
                    <figcaption><strong>图书馆前</strong><span>花香和书页，各有各的春天。</span></figcaption>
                </figure>
                <figure class="photo-item reveal" data-season="autumn">
                    <img src="../images/autumn-lake.jpg" alt="秋日中心湖与校园建筑" loading="lazy">
                    <figcaption><strong>中心湖</strong><span>风经过水面，秋天有了回声。</span></figcaption>
                </figure>
                <figure class="photo-item wide reveal" data-season="summer">
                    <img src="../images/aerial-campus.jpg" alt="俯瞰天津城建大学校园" loading="lazy">
                    <figcaption><strong>校园全景</strong><span>从高处看，熟悉的路也有了新方向。</span></figcaption>
                </figure>
                <figure class="photo-item reveal" data-season="spring">
                    <img src="../images/spring-building.jpg" alt="花枝与校园建筑" loading="lazy">
                    <figcaption><strong>教学楼旁</strong><span>一抬头，正好遇见花开。</span></figcaption>
                </figure>
                <figure class="photo-item reveal" data-season="autumn">
                    <img src="../images/campus-reflection.jpg" alt="秋树与校园建筑的倒影" loading="lazy">
                    <figcaption><strong>湖畔倒影</strong><span>建筑很理性，倒影却很温柔。</span></figcaption>
                </figure>
                <figure class="photo-item wide reveal" data-season="night">
                    <img src="../images/night-campus.jpg" alt="夜色中的天津城建大学" loading="lazy">
                    <figcaption><strong>广场夜色</strong><span>灯亮起来，晚课后的校园还没有睡。</span></figcaption>
                </figure>
                <figure class="photo-item reveal" data-season="summer">
                    <img src="../images/central-lake.jpg" alt="夏日中心湖景观" loading="lazy">
                    <figcaption><strong>湖边小坐</strong><span>树荫把午后切成细碎的光。</span></figcaption>
                </figure>
                <figure class="photo-item reveal" data-season="night">
                    <img src="../images/lake-sunset.jpg" alt="夕阳下的中心湖" loading="lazy">
                    <figcaption><strong>下课时分</strong><span>夕阳落进湖里，也落进今天的记忆。</span></figcaption>
                </figure>
            </div>
        </section>

        <section class="page-next section-wrap reveal">
            <span>下一章</span>
            <a href="culture.html">校园文化 <b>→</b></a>
        </section>
    </main>

    <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="图片预览">
        <button type="button" aria-label="关闭图片预览">×</button>
        <img src="../images/hero-autumn.jpg" alt="">
        <p></p>
    </div>

    <footer class="site-footer">
        <div><strong>城迹</strong><span>我心中的天城大</span></div>
        <p>图片来源于天津城建大学官网公开页面</p>
        <a href="https://www.tcu.edu.cn/xywh.htm" target="_blank" rel="noopener">图片来源 ↗</a>
    </footer>

    <button class="back-top" type="button" aria-label="回到顶部">↑</button>
    <script src="../js/main.js"></script>
    <script src="../js/gallery.js"></script>
</body>
</html>
